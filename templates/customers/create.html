{% extends "base.html" %}
{% block title %}{% if customer %}Edit Customer{% else %}Add Customer{% endif %}{% endblock %}
{% block content %}
<div class="mt-4 mb-3">
  <a href="{{ url_for('customers.list_customers') }}" class="btn btn-sm btn-outline-secondary me-2">
    <i class="bi bi-arrow-left"></i>
  </a>
  <span class="fs-4 fw-bold">{% if customer %}Edit Customer{% else %}Add Customer{% endif %}</span>
</div>
<div class="card shadow-sm" style="max-width:600px">
  <div class="card-body">
    <form method="POST">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
          <input type="text" name="name" class="form-control" required
                 value="{{ customer.name if customer else '' }}"/>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
          <input type="email" name="email" class="form-control" required
                 value="{{ customer.email if customer else '' }}"/>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Phone</label>
          <input type="text" name="phone" class="form-control"
                 value="{{ customer.phone if customer else '' }}"/>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Postal Code</label>
          <input type="text" name="postal_code" class="form-control"
                 value="{{ customer.postal_code if customer else '' }}"/>
        </div>
        <div class="col-12">
          <label class="form-label fw-semibold">Address</label>
          <input type="text" name="address" class="form-control"
                 value="{{ customer.address if customer else '' }}"/>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">City</label>
          <input type="text" name="city" class="form-control"
                 value="{{ customer.city if customer else '' }}"/>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Country</label>
          <input type="text" name="country" class="form-control"
                 value="{{ customer.country if customer else '' }}"/>
        </div>
      </div>
      <div class="d-flex justify-content-end gap-2 mt-4">
        <a href="{{ url_for('customers.list_customers') }}" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-save me-1"></i>Save Customer
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
