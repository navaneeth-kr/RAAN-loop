<header class="top-navbar">
  <div class="d-flex align-items-center gap-3">
    <!-- Mobile Hamburger Toggle -->
    <button class="btn btn-bl-outline d-lg-none p-1 px-2" id="sidebarToggleBtn" aria-label="Toggle Navigation">
      <i class="bi bi-list fs-5"></i>
    </button>

    <!-- Global Quick Search -->
    <form action="{% url 'dashboard' %}" method="get" class="d-none d-md-flex align-items-center position-relative" style="width: 320px;">
      <i class="bi bi-search position-absolute text-muted" style="left: 12px;"></i>
      <input 
        type="search" 
        name="q" 
        class="form-control ps-5 py-1 rounded-pill bg-light border-0" 
        placeholder="Quick search dashboard..." 
        style="font-size: 0.85rem;"
      >
    </form>
  </div>

  <!-- Right Actions -->
  <div class="d-flex align-items-center gap-3">
    <!-- Currency & Tax Badge -->
    <span class="badge bg-light text-dark border d-none d-sm-inline-flex align-items-center gap-1 py-2 px-3">
      <i class="bi bi-shield-check text-primary"></i>
      <span>{{ system_settings.company_name|default:"Brightloop" }}</span>
      <span class="text-muted ms-1">• {{ system_settings.currency_symbol|default:"$" }} ({{ system_settings.currency_code|default:"USD" }})</span>
    </span>

    <!-- Reports Shortcut -->
    <a href="{% url 'reports' %}" class="btn btn-sm btn-bl-outline d-none d-sm-inline-flex align-items-center gap-1" title="Date-based Reports">
      <i class="bi bi-bar-chart-line"></i>
      <span>Reports</span>
    </a>

    <!-- Notifications Center (Section 20) -->
    <a href="{% url 'notification_list' %}" class="btn btn-sm btn-bl-outline position-relative p-2" title="Notification Center">
      <i class="bi bi-bell-fill"></i>
      <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle" style="transform: translate(-30%, 30%) !important;">
        <span class="visually-hidden">Alerts</span>
      </span>
    </a>

    <!-- Settings Shortcut -->
    <a href="{% url 'admin_settings' %}" class="btn btn-sm btn-bl-outline p-2" title="System Settings">
      <i class="bi bi-gear-fill"></i>
    </a>

    <!-- Admin User / Logout -->
    {% if user.is_authenticated %}
      <div class="d-flex align-items-center gap-2 ps-2 border-start">
        <span class="badge bg-primary text-white py-1 px-2" style="font-size: 0.75rem;">Admin</span>
        <a href="{% url 'admin_logout' %}" class="btn btn-sm btn-outline-danger p-1 px-2" title="Sign Out">
          <i class="bi bi-box-arrow-right"></i>
        </a>
      </div>
    {% else %}
      <a href="{% url 'admin_login' %}" class="btn btn-sm btn-primary">Sign In</a>
    {% endif %}
  </div>
</header>
