{% extends "base.html" %}
{% block title %}New Subscription{% endblock %}
{% block content %}
<div class="mt-4 mb-3">
  <a href="{{ url_for('subscriptions.list_subscriptions') }}" class="btn btn-sm btn-outline-secondary me-2">
    <i class="bi bi-arrow-left"></i>
  </a>
  <span class="fs-4 fw-bold">New Subscription</span>
</div>
<div class="card shadow-sm" style="max-width:700px">
  <div class="card-body">
    <form method="POST">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Customer <span class="text-danger">*</span></label>
          <select name="customer_id" class="form-select" required>
            <option value="">Select customer…</option>
            {% for c in customers %}
            <option value="{{ c.id }}">{{ c.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Product <span class="text-danger">*</span></label>
          <select name="product_id" class="form-select" id="productSelect" required>
            <option value="">Select product…</option>
            {% for p in products %}
            <option value="{{ p.id }}" data-price="{{ p.unit_price }}" data-cycle="{{ p.billing_cycle }}">
              {{ p.name }} – ${{ "%.2f"|format(p.unit_price|float) }}/{{ p.billing_cycle }}
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold">Quantity</label>
          <input type="number" name="quantity" class="form-control" value="1" min="1"/>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold">Unit Price <span class="text-danger">*</span></label>
          <input type="number" name="unit_price" id="unitPriceField" class="form-control"
                 step="0.01" min="0" required placeholder="0.00"/>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold">Billing Cycle</label>
          <select name="billing_cycle" id="billingCycleField" class="form-select">
            <option value="monthly">Monthly</option>
            <option value="yearly">Yearly</option>
            <option value="weekly">Weekly</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Start Date <span class="text-danger">*</span></label>
          <input type="date" name="start_date" class="form-control" value="{{ today }}" required/>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Discount (%)</label>
          <input type="number" name="discount_percent" class="form-control"
                 step="0.01" min="0" max="100" value="0"/>
        </div>
        <div class="col-12">
          <label class="form-label fw-semibold">Notes</label>
          <textarea name="notes" class="form-control" rows="2"></textarea>
        </div>
      </div>
      <div class="d-flex justify-content-end gap-2 mt-4">
        <a href="{{ url_for('subscriptions.list_subscriptions') }}" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-plus-circle me-1"></i>Create Subscription
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('productSelect').addEventListener('change', function() {
  const opt = this.options[this.selectedIndex];
  if (!opt.value) return;
  document.getElementById('unitPriceField').value = opt.dataset.price;
  document.getElementById('billingCycleField').value = opt.dataset.cycle;
});
</script>
{% endblock %}
