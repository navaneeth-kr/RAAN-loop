{% extends "base.html" %}
{% block title %}{% if product %}Edit Product{% else %}Add Product{% endif %}{% endblock %}
{% block content %}
<div class="mt-4 mb-3">
  <a href="{{ url_for('admin.product_list') }}" class="btn btn-sm btn-outline-secondary me-2">
    <i class="bi bi-arrow-left"></i>
  </a>
  <span class="fs-4 fw-bold">{% if product %}Edit Product{% else %}Add Product{% endif %}</span>
</div>
<div class="card shadow-sm" style="max-width:600px">
  <div class="card-body">
    <form method="POST">
      <div class="mb-3">
        <label class="form-label fw-semibold">Product Name <span class="text-danger">*</span></label>
        <input type="text" name="name" class="form-control" required
               value="{{ product.name if product else '' }}"/>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Description</label>
        <textarea name="description" class="form-control" rows="3">{{ product.description if product else '' }}</textarea>
      </div>
      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Unit Price ($) <span class="text-danger">*</span></label>
          <input type="number" name="unit_price" class="form-control" step="0.01" min="0" required
                 value="{{ product.unit_price if product else '' }}"/>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Billing Cycle</label>
          <select name="billing_cycle" class="form-select">
            {% for cycle in ['monthly', 'yearly', 'weekly', 'one-time'] %}
            <option value="{{ cycle }}"
                    {% if product and product.billing_cycle == cycle %}selected{% endif %}>
              {{ cycle|capitalize }}
            </option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" name="is_active" id="isActive"
               {% if not product or product.is_active %}checked{% endif %}/>
        <label class="form-check-label fw-semibold" for="isActive">Active</label>
      </div>
      <div class="d-flex justify-content-end gap-2 mt-4">
        <a href="{{ url_for('admin.product_list') }}" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-save me-1"></i>Save Product
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
