{% extends "base.html" %}
{% block title %}{% if tax %}Edit Tax{% else %}Add Tax{% endif %}{% endblock %}
{% block content %}
<div class="mt-4 mb-3">
  <a href="{{ url_for('admin.tax_list') }}" class="btn btn-sm btn-outline-secondary me-2">
    <i class="bi bi-arrow-left"></i>
  </a>
  <span class="fs-4 fw-bold">{% if tax %}Edit Tax{% else %}Add Tax Rate{% endif %}</span>
</div>
<div class="card shadow-sm" style="max-width:500px">
  <div class="card-body">
    <form method="POST">
      <div class="mb-3">
        <label class="form-label fw-semibold">Tax Name <span class="text-danger">*</span></label>
        <input type="text" name="name" class="form-control" required
               placeholder="e.g. GST, VAT, Sales Tax"
               value="{{ tax.name if tax else '' }}"/>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Rate (%) <span class="text-danger">*</span></label>
        <input type="number" name="rate" class="form-control" step="0.01" min="0" max="100" required
               placeholder="e.g. 18.00"
               value="{{ tax.rate if tax else '' }}"/>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Description</label>
        <input type="text" name="description" class="form-control"
               placeholder="Optional description"
               value="{{ tax.description if tax else '' }}"/>
      </div>
      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" name="is_active" id="isActive"
               {% if not tax or tax.is_active %}checked{% endif %}/>
        <label class="form-check-label fw-semibold" for="isActive">Active (apply to new invoices)</label>
      </div>
      <div class="d-flex justify-content-end gap-2 mt-4">
        <a href="{{ url_for('admin.tax_list') }}" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-save me-1"></i>Save Tax
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
