{% load static %}
<aside class="saas-sidebar">
    <div class="sidebar-header">
        <a href="{% url 'dashboard:index' %}" class="brand-logo">

                <i class="bi bi-layers-fill"></i>

            <div>
                <div class="brand-title">Brightloop</div>
                <div class="brand-subtitle">Subscription SaaS</div>
            </div>
        </a>
    </div>

    <ul class="sidebar-menu">
        <li class="menu-category">Overview</li>
        <li class="nav-item">
            <a href="{% url 'dashboard:index' %}" class="nav-link-custom {% if active_tab == 'dashboard' %}active{% endif %}">
                <i class="bi bi-grid-1x2-fill"></i>
                <span>Dashboard</span>
            </a>
        </li>

        <li class="menu-category">Catalog & Products</li>
        <li class="nav-item">
            <a href="{% url 'products:index' %}" class="nav-link-custom {% if active_tab == 'products' %}active{% endif %}">
                <i class="bi bi-box-seam-fill"></i>

            </a>
        </li>
        <li class="nav-item">
            <a href="{% url 'plans:index' %}" class="nav-link-custom {% if active_tab == 'plans' %}active{% endif %}">

            </a>
        </li>

        <li class="menu-category">Management</li>
        <li class="nav-item">
            <a href="{% url 'subscriptions:index' %}" class="nav-link-custom {% if active_tab == 'subscriptions' %}active{% endif %}">

        <li class="nav-item">
            <a href="{% url 'accounts:index' %}" class="nav-link-custom {% if active_tab == 'accounts' %}active{% endif %}">

        </li>

        <li class="menu-category">Finance & Revenue</li>
        <li class="nav-item">
            <a href="{% url 'billing:index' %}" class="nav-link-custom {% if active_tab == 'billing' %}active{% endif %}">

        <li class="nav-item">
            <a href="{% url 'payments:index' %}" class="nav-link-custom {% if active_tab == 'payments' %}active{% endif %}">
                <i class="bi bi-credit-card-2-front-fill"></i>
                <span>Payments & Gateway</span>
            </a>
        </li>
    </ul>

    <div class="sidebar-footer">
        <div class="user-badge-pill">
            <div class="user-avatar-small">BL</div>
            <div class="overflow-hidden">
                <div class="fw-semibold text-white text-truncate" style="font-size: 0.85rem;">Brightloop Admin</div>
                <div class="text-secondary text-truncate" style="font-size: 0.75rem;">admin@brightloop.io</div>
